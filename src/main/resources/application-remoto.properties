# ==========================================
# BASE DE DATOS REMOTA (servidor en la nube)
# Los valores se leen de variables de entorno: en el repositorio solo queda el NOMBRE de la variable.
# Se activa con SPRING_PROFILES_ACTIVE=remoto
# ==========================================
spring.datasource.url=${DB_REMOTO_URL}
spring.datasource.username=${DB_REMOTO_USUARIO}
spring.datasource.password=${DB_REMOTO_CONTRASENA}

# En el servidor remoto no se muestran las consultas SQL en consola
spring.jpa.show-sql=false
