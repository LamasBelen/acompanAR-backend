<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación - acompanAR</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompan<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="tarjeta tarjeta-angosta">
            <h1 id="titulo">Nueva capacitación</h1>
            <p class="subtitulo">Publicá un curso para los profesionales.</p>

            <form id="formCapacitacion">
                <label for="tituloCap">Título</label>
                <input type="text" id="tituloCap" required maxlength="255">

                <label for="institucion">Institución</label>
                <select id="institucion" required></select>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" required maxlength="1000"></textarea>

                <div class="fila">
                    <div>
                        <label for="cargaHoraria">Carga horaria (horas)</label>
                        <input type="number" id="cargaHoraria" required min="1">
                    </div>
                    <div>
                        <label for="fechaInicio">Fecha de inicio</label>
                        <input type="date" id="fechaInicio">
                    </div>
                </div>

                <label for="linkVideo">Enlace al material (opcional)</label>
                <input type="url" id="linkVideo" maxlength="255" placeholder="https://...">

                <button type="submit" class="boton boton-ancho" id="botonGuardar">Publicar capacitación</button>
                <div id="mensaje" class="mensaje"></div>
            </form>

            <p class="pie-formulario"><a href="admin-capacitaciones.html">Volver a las capacitaciones</a></p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        // Si la dirección trae ?id=5 estamos EDITANDO la capacitación 5; si no, estamos creando una nueva
        const idCapacitacion = new URLSearchParams(window.location.search).get("id");
        const mensaje = document.getElementById("mensaje");
        let esInstitucion = false;

        async function iniciar() {
            const usuario = await requerirSesion();
            if (usuario === null) return;

            if (usuario.rol !== "ADMINISTRADOR" && usuario.rol !== "INSTITUCION") {
                mostrarMensaje(mensaje, "Esta pantalla es para administradores e instituciones.", "error");
                document.getElementById("formCapacitacion").style.display = "none";
                return;
            }
            esInstitucion = usuario.rol === "INSTITUCION";

            if (esInstitucion) {
                // Una institución publica siempre a su nombre: no elige institución
                document.getElementById("institucion").required = false;
                document.getElementById("institucion").previousElementSibling.style.display = "none";
                document.getElementById("institucion").style.display = "none";

                const mia = await pedir("/api/instituciones/mia");
                if (mia.ok && mia.datos.estadoVerificacion !== "VERIFICADA") {
                    mostrarMensaje(mensaje, mia.datos.estadoVerificacion === "PENDIENTE"
                        ? "Tu institución está pendiente de verificación. Cuando el administrador la apruebe vas a poder publicar capacitaciones."
                        : "La solicitud de tu institución fue rechazada, no podés publicar capacitaciones.", "error");
                    document.getElementById("formCapacitacion").style.display = "none";
                    return;
                }
            } else {
                // El administrador elige entre las instituciones activas y verificadas
                const instituciones = await pedir("/api/instituciones");
                llenarSelect(document.getElementById("institucion"),
                    (instituciones.ok ? instituciones.datos : []).map(function (i) { return { valor: i.id, texto: i.nombre }; }));
            }

            if (idCapacitacion !== null) {
                document.getElementById("titulo").textContent = "Editar capacitación";
                document.getElementById("botonGuardar").textContent = "Guardar cambios";

                const resultado = await pedir("/api/capacitaciones/" + idCapacitacion);
                if (!resultado.ok) {
                    mostrarMensaje(mensaje, "No se pudo cargar la capacitación.", "error");
                    return;
                }
                const cap = resultado.datos;
                document.getElementById("tituloCap").value = cap.titulo;
                if (!esInstitucion) document.getElementById("institucion").value = cap.institucion.id;
                document.getElementById("descripcion").value = cap.descripcion;
                document.getElementById("cargaHoraria").value = cap.cargaHoraria;
                document.getElementById("fechaInicio").value = cap.fechaInicio || "";
                document.getElementById("linkVideo").value = cap.linkVideo || "";
            }
        }

        document.getElementById("formCapacitacion").addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const fecha = document.getElementById("fechaInicio").value;
            const enlace = document.getElementById("linkVideo").value.trim();
            const datos = {
                titulo: document.getElementById("tituloCap").value.trim(),
                institucionId: esInstitucion ? null : Number(document.getElementById("institucion").value),
                descripcion: document.getElementById("descripcion").value.trim(),
                cargaHoraria: parseInt(document.getElementById("cargaHoraria").value, 10),
                fechaInicio: fecha === "" ? null : fecha,   // si no eligen fecha, el backend usa hoy + 15 días
                linkVideo: enlace === "" ? null : enlace
            };

            let resultado;
            if (idCapacitacion !== null) {
                resultado = await pedir("/api/capacitaciones/editar/" + idCapacitacion, "PUT", datos);
            } else {
                resultado = await pedir("/api/capacitaciones/nueva", "POST", datos);
            }

            if (resultado.ok) {
                window.location.href = "admin-capacitaciones.html";
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo guardar la capacitación. Intentá de nuevo."), "error");
            }
        });

        iniciar();
    </script>
</body>
</html>
