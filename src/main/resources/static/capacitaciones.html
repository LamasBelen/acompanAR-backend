<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitaciones - acompañAR</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompañ<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="cabecera-pagina">
            <h1>Capacitaciones</h1>
            <p class="subtitulo">Cursos para seguir formándote. Inscribite a los que te interesen.</p>
        </div>

        <div id="mensaje" class="mensaje"></div>
        <div class="con-lateral">
            <aside class="filtros" id="filtros" style="display: none;">
                <h2>Filtrar capacitaciones</h2>
                <label for="fBuscar">Buscar</label>
                <input type="search" id="fBuscar" placeholder="Título, institución o tema" maxlength="80">

                <label for="fInstitucion">Institución</label>
                <select id="fInstitucion"></select>

                <label for="fOrden">Ordenar por</label>
                <select id="fOrden">
                    <option value="fecha">Comienzan antes</option>
                    <option value="menor">Menor carga horaria</option>
                    <option value="mayor">Mayor carga horaria</option>
                </select>

                <label class="casilla"><input type="checkbox" id="fFuturas"> Solo las que todavía no empezaron</label>
                <label class="casilla"><input type="checkbox" id="fOcultar"> Ocultar en las que ya estoy inscripto</label>

                <button type="button" class="boton boton-chico boton-secundario boton-ancho" id="fLimpiar">Limpiar filtros</button>
            </aside>
            <section>
                <p class="detalle" id="contador"></p>
                <div id="lista" class="lista"></div>
            </section>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        const lista = document.getElementById("lista");
        const mensaje = document.getElementById("mensaje");
        let usuario = null;
        let todas = [];
        let yaInscripto = new Set();

        async function cargar() {
            usuario = await requerirSesion();
            if (usuario === null) return;

            if (usuario.rol !== "PROFESIONAL") {
                mostrarMensaje(mensaje, "Esta pantalla es para profesionales.", "error");
                return;
            }

            const capacitaciones = await pedir("/api/capacitaciones");
            const inscripciones = await pedir("/api/inscripciones/profesional/" + usuario.idProfesional);

            if (!capacitaciones.ok) {
                mostrarMensaje(mensaje, "No se pudieron cargar las capacitaciones.", "error");
                return;
            }

            // Ids de las capacitaciones en las que ya estoy inscripto (las canceladas no cuentan)
            yaInscripto = new Set();
            if (inscripciones.ok) {
                inscripciones.datos.forEach(function (i) {
                    if (i.estado !== "CANCELADA") {
                        yaInscripto.add(i.capacitacion.id);
                    }
                });
            }

            todas = capacitaciones.datos;
            const instituciones = Array.from(new Set(todas.map(function (c) { return c.institucion.nombre; }))).sort();
            llenarSelect(document.getElementById("fInstitucion"),
                instituciones.map(function (n) { return { valor: n, texto: n }; }), "Todas las instituciones");
            if (todas.length > 0) document.getElementById("filtros").style.display = "block";
            mostrar();
        }

        // Texto en minúsculas y sin tildes, para que "enfermería" encuentre "Enfermeria"
        function normalizar(texto) {
            return (texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function hoyTexto() {
            const h = new Date();
            return h.getFullYear() + "-" + String(h.getMonth() + 1).padStart(2, "0") + "-" + String(h.getDate()).padStart(2, "0");
        }

        // Aplica los filtros y el orden elegidos y vuelve a dibujar la lista
        function mostrar() {
            const buscar = normalizar(document.getElementById("fBuscar").value.trim());
            const institucion = document.getElementById("fInstitucion").value;
            const soloFuturas = document.getElementById("fFuturas").checked;
            const ocultar = document.getElementById("fOcultar").checked;
            const orden = document.getElementById("fOrden").value;
            const hoy = hoyTexto();

            let visibles = todas.filter(function (c) {
                if (buscar && normalizar(c.titulo + " " + c.descripcion + " " + c.institucion.nombre).indexOf(buscar) === -1) return false;
                if (institucion && c.institucion.nombre !== institucion) return false;
                if (soloFuturas && (c.fechaInicio || "") < hoy) return false;
                if (ocultar && yaInscripto.has(c.id)) return false;
                return true;
            });
            visibles = visibles.slice().sort(function (a, b) {
                if (orden === "menor") return a.cargaHoraria - b.cargaHoraria;
                if (orden === "mayor") return b.cargaHoraria - a.cargaHoraria;
                return (a.fechaInicio || "").localeCompare(b.fechaInicio || "");
            });

            lista.innerHTML = "";
            const contador = document.getElementById("contador");
            if (todas.length === 0) {
                contador.textContent = "";
                lista.appendChild(crear("p", "vacio", "Por ahora no hay capacitaciones disponibles."));
                return;
            }
            contador.textContent = visibles.length + " de " + todas.length + " capacitación(es)";
            if (visibles.length === 0) {
                lista.appendChild(crear("p", "vacio", "Ninguna capacitación coincide con esos filtros. Probá con menos condiciones."));
                return;
            }
            visibles.forEach(function (cap) {
                lista.appendChild(armarTarjeta(cap, yaInscripto.has(cap.id)));
            });
        }

        ["fBuscar", "fInstitucion", "fOrden", "fFuturas", "fOcultar"].forEach(function (id) {
            document.getElementById(id).addEventListener(id === "fBuscar" ? "input" : "change", mostrar);
        });
        document.getElementById("fLimpiar").addEventListener("click", function () {
            document.getElementById("fBuscar").value = "";
            document.getElementById("fInstitucion").value = "";
            document.getElementById("fOrden").value = "fecha";
            document.getElementById("fFuturas").checked = false;
            document.getElementById("fOcultar").checked = false;
            mostrar();
        });

        function armarTarjeta(cap, inscripto) {
            const tarjeta = crear("div", "tarjeta item");

            const info = crear("div");
            info.appendChild(crear("h2", "", cap.titulo));
            info.appendChild(crear("p", "detalle",
                cap.institucion.nombre + " · " + cap.cargaHoraria + " hs · Comienza el " + formatearFecha(cap.fechaInicio)));
            info.appendChild(crear("p", "", cap.descripcion));
            const enlace = crearEnlaceSeguro(cap.linkVideo, "Ver material");
            if (enlace !== null) {
                const parrafo = crear("p", "detalle");
                parrafo.appendChild(enlace);
                info.appendChild(parrafo);
            }

            const acciones = crear("div", "acciones");
            const boton = crear("button", "boton boton-chico", inscripto ? "Ya estás inscripto" : "Inscribirme");
            boton.disabled = inscripto;
            boton.addEventListener("click", function () { inscribirse(cap.id, boton); });
            acciones.appendChild(boton);
            agregarBotonDenuncia(acciones, info, "CAPACITACION", cap.id);

            tarjeta.appendChild(conAvatar(crearAvatar(cap.institucion.nombre), info));
            tarjeta.appendChild(acciones);
            return tarjeta;
        }

        async function inscribirse(idCapacitacion, boton) {
            boton.disabled = true;
            const resultado = await pedir("/api/inscripciones/nueva", "POST", {
                idProfesional: usuario.idProfesional,
                idCapacitacion: idCapacitacion
            });

            if (resultado.ok) {
                boton.textContent = "Ya estás inscripto";
                mostrarMensaje(mensaje, "¡Inscripción confirmada! La encontrás en \"Mis capacitaciones\".", "ok");
            } else if (resultado.status === 409) {
                boton.textContent = "Ya estás inscripto";
                mostrarMensaje(mensaje, mensajeDeError(resultado, "Ya estabas inscripto en esta capacitación."), "error");
            } else {
                boton.disabled = false;
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo completar la inscripción."), "error");
            }
        }

        cargar();
    </script>
</body>
</html>
