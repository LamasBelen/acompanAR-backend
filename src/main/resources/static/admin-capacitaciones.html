<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar capacitaciones - acompanAR</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompan<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="cabecera-pagina item">
            <div>
                <h1>Capacitaciones publicadas</h1>
                <p class="subtitulo">Las capacitaciones que están activas en la plataforma.</p>
            </div>
            <a class="boton" href="capacitacion-form.html">Nueva capacitación</a>
        </div>

        <div id="estadoInstitucion"></div>
        <div id="mensaje" class="mensaje"></div>
        <div id="lista" class="lista"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        const lista = document.getElementById("lista");
        const mensaje = document.getElementById("mensaje");

        async function cargar() {
            const usuario = await requerirSesion();
            if (usuario === null) return;

            if (usuario.rol !== "ADMINISTRADOR" && usuario.rol !== "INSTITUCION") {
                mostrarMensaje(mensaje, "Esta pantalla es para administradores e instituciones.", "error");
                return;
            }

            // El administrador ve todas; una institución, solo las suyas
            let url = "/api/capacitaciones";
            if (usuario.rol === "INSTITUCION") {
                url = "/api/capacitaciones/mias";
                document.querySelector("h1").textContent = "Mis capacitaciones";
                document.querySelector(".subtitulo").textContent = "Las capacitaciones que publicó tu institución.";
                await mostrarEstadoInstitucion();
            }

            const resultado = await pedir(url);
            if (!resultado.ok) {
                mostrarMensaje(mensaje, "No se pudieron cargar las capacitaciones.", "error");
                return;
            }

            lista.innerHTML = "";
            if (resultado.datos.length === 0) {
                lista.appendChild(crear("p", "vacio", "Todavía no hay capacitaciones publicadas."));
                return;
            }
            resultado.datos.forEach(function (cap) {
                lista.appendChild(armarTarjeta(cap));
            });
        }

        // Avisa si la institución todavía no puede publicar
        async function mostrarEstadoInstitucion() {
            const resultado = await pedir("/api/instituciones/mia");
            if (!resultado.ok) return;
            const caja = document.getElementById("estadoInstitucion");
            const estado = resultado.datos.estadoVerificacion;
            let texto = null;
            if (estado === "PENDIENTE") texto = "Tu institución está pendiente de verificación. Cuando el administrador la apruebe vas a poder publicar capacitaciones.";
            if (estado === "RECHAZADA") texto = "La solicitud de tu institución fue rechazada por el administrador.";
            if (texto) {
                const aviso = crear("div", "aviso aviso-atencion");
                aviso.appendChild(crear("p", "", texto));
                caja.appendChild(aviso);
            }
        }

        function armarTarjeta(cap) {
            const tarjeta = crear("div", "tarjeta item");

            const info = crear("div");
            info.appendChild(crear("h2", "", cap.titulo));
            info.appendChild(crear("p", "detalle",
                cap.institucion.nombre + " · " + cap.cargaHoraria + " hs · Comienza el " + formatearFecha(cap.fechaInicio)));
            info.appendChild(crear("p", "", cap.descripcion));

            // Inscriptos: cantidad y lista (se carga al abrir la pantalla)
            const inscriptos = crear("p", "detalle", "Inscriptos: ...");
            const listaInscriptos = crear("div");
            listaInscriptos.style.display = "none";
            info.appendChild(inscriptos);
            info.appendChild(listaInscriptos);
            cargarInscriptos(cap.id).then(function (lista) {
                inscriptos.textContent = textoInscriptos(inscriptosVigentes(lista).length);
                mostrarInscriptos(listaInscriptos, lista);
            });

            const acciones = crear("div", "acciones");
            const verInscriptos = crear("button", "boton boton-chico", "Ver inscriptos");
            verInscriptos.addEventListener("click", function () {
                const oculta = listaInscriptos.style.display === "none";
                listaInscriptos.style.display = oculta ? "block" : "none";
                verInscriptos.textContent = oculta ? "Ocultar inscriptos" : "Ver inscriptos";
            });
            acciones.appendChild(verInscriptos);
            acciones.appendChild(crear("a", "boton boton-chico boton-secundario", "Editar", { href: "capacitacion-form.html?id=" + cap.id }));
            const baja = crear("button", "boton boton-chico boton-peligro", "Dar de baja");
            baja.addEventListener("click", function () { darDeBaja(cap.id); });
            acciones.appendChild(baja);

            tarjeta.appendChild(info);
            tarjeta.appendChild(acciones);
            return tarjeta;
        }

        async function darDeBaja(idCapacitacion) {
            if (!confirm("¿Querés dar de baja esta capacitación? Ya no la van a ver los profesionales.")) return;

            const resultado = await pedir("/api/capacitaciones/baja/" + idCapacitacion, "PUT");
            if (resultado.ok) {
                cargar();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo dar de baja la capacitación."), "error");
            }
        }

        cargar();
    </script>
</body>
</html>
