<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituciones y tipos de profesional - acompanAR</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompan<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="cabecera-pagina">
            <h1>Instituciones y tipos de profesional</h1>
            <p class="subtitulo">Administrá las listas que usan los formularios de la plataforma.</p>
        </div>
        <div id="mensaje" class="mensaje"></div>

        <!-- ================= INSTITUCIONES ================= -->
        <div id="zonaAdmin" style="display: none;">
            <div class="tarjeta">
                <h2 id="tituloInstitucion">Nueva institución</h2>
                <form id="formInstitucion">
                    <label for="nombreInstitucion">Nombre</label>
                    <input type="text" id="nombreInstitucion" required maxlength="150">

                    <div class="fila">
                        <div>
                            <label for="tipoInstitucion">Tipo</label>
                            <select id="tipoInstitucion" required></select>
                        </div>
                        <div>
                            <label for="localidadInstitucion">Localidad</label>
                            <select id="localidadInstitucion" required></select>
                        </div>
                    </div>

                    <button type="submit" class="boton" id="botonInstitucion">Guardar institución</button>
                    <button type="button" class="boton boton-secundario" id="cancelarInstitucion" style="display: none;">Cancelar edición</button>
                </form>
            </div>
            <div id="listaInstituciones" class="lista"></div>

            <!-- ================= TIPOS DE PROFESIONAL ================= -->
            <div class="tarjeta" style="margin-top: 30px;">
                <h2 id="tituloTipo">Nuevo tipo de profesional</h2>
                <form id="formTipo">
                    <label for="nombreTipo">Nombre</label>
                    <input type="text" id="nombreTipo" required maxlength="100" placeholder="Ej: Kinesiólogo/a">

                    <button type="submit" class="boton" id="botonTipo">Guardar tipo</button>
                    <button type="button" class="boton boton-secundario" id="cancelarTipo" style="display: none;">Cancelar edición</button>
                </form>
            </div>
            <div id="listaTipos" class="lista"></div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        const mensaje = document.getElementById("mensaje");
        let idInstitucionEditando = null; // null = estamos creando; con un número = editando esa institución
        let idTipoEditando = null;

        async function iniciar() {
            const usuario = await requerirSesion();
            if (usuario === null) return;
            if (usuario.rol !== "ADMINISTRADOR") {
                mostrarMensaje(mensaje, "Esta pantalla es para administradores.", "error");
                return;
            }
            document.getElementById("zonaAdmin").style.display = "block";

            await llenarLocalidades(document.getElementById("localidadInstitucion"));
            const tipos = await pedir("/api/catalogos/tipos-institucion");
            llenarSelect(document.getElementById("tipoInstitucion"),
                (tipos.ok ? tipos.datos : []).map(function (t) { return { valor: t.codigo, texto: t.nombre }; }));

            cargarInstituciones();
            cargarTipos();
        }

        // ---------------- Instituciones ----------------
        async function cargarInstituciones() {
            const lista = document.getElementById("listaInstituciones");
            const resultado = await pedir("/api/instituciones/todas");
            if (!resultado.ok) {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudieron cargar las instituciones."), "error");
                return;
            }
            lista.innerHTML = "";
            if (resultado.datos.length === 0) {
                lista.appendChild(crear("p", "vacio", "No hay instituciones cargadas."));
            }
            resultado.datos.forEach(function (inst) {
                const tarjeta = crear("div", "tarjeta item");
                const info = crear("div");
                info.appendChild(crear("h2", "", inst.nombre));
                info.appendChild(crear("p", "detalle",
                    (inst.tipo === "PUBLICA" ? "Pública" : "Privada") + " · " + nombreLocalidad(inst.localidad)));
                const acciones = crear("div", "acciones");
                acciones.appendChild(crear("span", "estado estado-" + inst.estadoVerificacion, inst.estadoVerificacion));
                const editar = crear("button", "boton boton-chico boton-secundario", "Editar");
                editar.addEventListener("click", function () { empezarEdicionInstitucion(inst); });
                const baja = crear("button", "boton boton-chico boton-peligro", "Dar de baja");
                baja.addEventListener("click", function () { bajaInstitucion(inst.id); });
                acciones.appendChild(editar);
                acciones.appendChild(baja);
                tarjeta.appendChild(info);
                tarjeta.appendChild(acciones);
                lista.appendChild(tarjeta);
            });
        }

        function empezarEdicionInstitucion(inst) {
            idInstitucionEditando = inst.id;
            document.getElementById("tituloInstitucion").textContent = "Editar institución";
            document.getElementById("nombreInstitucion").value = inst.nombre;
            document.getElementById("tipoInstitucion").value = inst.tipo;
            document.getElementById("localidadInstitucion").value = inst.localidad;
            document.getElementById("botonInstitucion").textContent = "Guardar cambios";
            document.getElementById("cancelarInstitucion").style.display = "inline-block";
            window.scrollTo(0, 0);
        }

        function terminarEdicionInstitucion() {
            idInstitucionEditando = null;
            document.getElementById("formInstitucion").reset();
            document.getElementById("tituloInstitucion").textContent = "Nueva institución";
            document.getElementById("botonInstitucion").textContent = "Guardar institución";
            document.getElementById("cancelarInstitucion").style.display = "none";
        }

        document.getElementById("cancelarInstitucion").addEventListener("click", terminarEdicionInstitucion);

        document.getElementById("formInstitucion").addEventListener("submit", async function (evento) {
            evento.preventDefault();
            const datos = {
                nombre: document.getElementById("nombreInstitucion").value.trim(),
                tipo: document.getElementById("tipoInstitucion").value,
                localidad: document.getElementById("localidadInstitucion").value
            };
            const resultado = idInstitucionEditando === null
                ? await pedir("/api/instituciones/nueva", "POST", datos)
                : await pedir("/api/instituciones/editar/" + idInstitucionEditando, "PUT", datos);
            if (resultado.ok) {
                mostrarMensaje(mensaje, "Institución guardada.", "ok");
                terminarEdicionInstitucion();
                cargarInstituciones();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo guardar la institución."), "error");
            }
        });

        async function bajaInstitucion(id) {
            if (!confirm("¿Dar de baja esta institución? Ya no se podrá elegir para nuevas capacitaciones.")) return;
            const resultado = await pedir("/api/instituciones/baja/" + id, "PUT");
            if (resultado.ok) {
                mostrarMensaje(mensaje, "Institución dada de baja.", "ok");
                cargarInstituciones();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo dar de baja la institución."), "error");
            }
        }

        // ---------------- Tipos de profesional ----------------
        async function cargarTipos() {
            const lista = document.getElementById("listaTipos");
            const resultado = await pedir("/api/tipos-profesional");
            if (!resultado.ok) {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudieron cargar los tipos de profesional."), "error");
                return;
            }
            lista.innerHTML = "";
            if (resultado.datos.length === 0) {
                lista.appendChild(crear("p", "vacio", "No hay tipos de profesional cargados."));
            }
            resultado.datos.forEach(function (tipo) {
                const tarjeta = crear("div", "tarjeta item");
                const info = crear("div");
                info.appendChild(crear("h2", "", tipo.nombre));
                const acciones = crear("div", "acciones");
                const editar = crear("button", "boton boton-chico boton-secundario", "Editar");
                editar.addEventListener("click", function () { empezarEdicionTipo(tipo); });
                const baja = crear("button", "boton boton-chico boton-peligro", "Dar de baja");
                baja.addEventListener("click", function () { bajaTipo(tipo.id); });
                acciones.appendChild(editar);
                acciones.appendChild(baja);
                tarjeta.appendChild(info);
                tarjeta.appendChild(acciones);
                lista.appendChild(tarjeta);
            });
        }

        function empezarEdicionTipo(tipo) {
            idTipoEditando = tipo.id;
            document.getElementById("tituloTipo").textContent = "Editar tipo de profesional";
            document.getElementById("nombreTipo").value = tipo.nombre;
            document.getElementById("botonTipo").textContent = "Guardar cambios";
            document.getElementById("cancelarTipo").style.display = "inline-block";
            document.getElementById("formTipo").scrollIntoView();
        }

        function terminarEdicionTipo() {
            idTipoEditando = null;
            document.getElementById("formTipo").reset();
            document.getElementById("tituloTipo").textContent = "Nuevo tipo de profesional";
            document.getElementById("botonTipo").textContent = "Guardar tipo";
            document.getElementById("cancelarTipo").style.display = "none";
        }

        document.getElementById("cancelarTipo").addEventListener("click", terminarEdicionTipo);

        document.getElementById("formTipo").addEventListener("submit", async function (evento) {
            evento.preventDefault();
            const datos = { nombre: document.getElementById("nombreTipo").value.trim() };
            const resultado = idTipoEditando === null
                ? await pedir("/api/tipos-profesional/nuevo", "POST", datos)
                : await pedir("/api/tipos-profesional/editar/" + idTipoEditando, "PUT", datos);
            if (resultado.ok) {
                mostrarMensaje(mensaje, "Tipo de profesional guardado.", "ok");
                terminarEdicionTipo();
                cargarTipos();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo guardar el tipo de profesional."), "error");
            }
        });

        async function bajaTipo(id) {
            if (!confirm("¿Dar de baja este tipo? Ya no se podrá elegir al registrarse.")) return;
            const resultado = await pedir("/api/tipos-profesional/baja/" + id, "PUT");
            if (resultado.ok) {
                mostrarMensaje(mensaje, "Tipo de profesional dado de baja.", "ok");
                cargarTipos();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo dar de baja el tipo de profesional."), "error");
            }
        }

        iniciar();
    </script>
</body>
</html>
