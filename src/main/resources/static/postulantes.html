<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulantes - acompañAR</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompañ<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="cabecera-pagina">
            <h1>Postulantes</h1>
            <p class="subtitulo" id="subtitulo">Profesionales que se postularon a tu oferta.</p>
            <p><a href="mis-ofertas.html">← Volver a mis ofertas</a></p>
        </div>

        <div id="mensaje" class="mensaje"></div>
        <div id="lista" class="lista"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        // La dirección trae ?oferta=5: es la oferta de la que queremos ver los postulantes
        const idOferta = new URLSearchParams(window.location.search).get("oferta");
        const lista = document.getElementById("lista");
        const mensaje = document.getElementById("mensaje");
        let calificadas = new Set(); // postulaciones que ya calificó este empleador
        let sinLeer = new Map();     // mensajes sin leer por postulación

        async function cargar() {
            await cargarLocalidades(); // para mostrar "Río Grande" en vez de "RIO_GRANDE"
            const usuario = await requerirSesion();
            if (usuario === null) return;

            if (usuario.rol !== "EMPLEADOR" || idOferta === null) {
                mostrarMensaje(mensaje, "No se puede mostrar esta pantalla.", "error");
                return;
            }

            calificadas = await cargarCalificacionesHechas();
            sinLeer = await cargarMensajesPendientes();
            const resultado = await pedir("/api/postulaciones/oferta/" + idOferta);
            if (!resultado.ok) {
                mostrarMensaje(mensaje, "No se pudieron cargar los postulantes de esta oferta.", "error");
                return;
            }

            lista.innerHTML = "";
            if (resultado.datos.length === 0) {
                lista.appendChild(crear("p", "vacio", "Todavía nadie se postuló a esta oferta."));
                return;
            }
            // Mostramos el título de la oferta en el subtítulo
            document.getElementById("subtitulo").textContent =
                "Oferta: " + resultado.datos[0].ofertaLaboral.titulo;

            // Primero los que cumplen más requisitos de la oferta (a igualdad, se mantiene el orden)
            const cumplidos = function (p) {
                return calcularCoincidencia(p.ofertaLaboral.requisitosComunes, p.profesional.requisitosCumplidos).cumplidos.length;
            };
            resultado.datos.slice().sort(function (a, b) { return cumplidos(b) - cumplidos(a); }).forEach(function (postulacion) {
                lista.appendChild(armarTarjeta(postulacion));
            });
        }

        function armarTarjeta(postulacion) {
            const profesional = postulacion.profesional;
            const persona = profesional.persona;
            const tarjeta = crear("div", "tarjeta item");

            const info = crear("div");
            info.appendChild(crear("h2", "", persona.nombre + " " + persona.apellido));
            const datos = crear("div", "etiquetas");
            datos.appendChild(crear("span", "etiqueta", profesional.tipoProfesional.nombre));
            datos.appendChild(crear("span", "etiqueta neutra", "📍 " + nombreLocalidad(persona.localidad)));
            datos.appendChild(crear("span", "etiqueta neutra", "Se postuló el " + formatearFecha(postulacion.fechaPostulacion)));
            info.appendChild(datos);
            if (profesional.matricula) {
                info.appendChild(crear("p", "detalle", "Matrícula: " + profesional.matricula));
            }
            if (profesional.disponibilidad) {
                info.appendChild(crear("p", "detalle", "Disponibilidad: " + profesional.disponibilidad));
            }
            info.appendChild(crear("p", "detalle", "Experiencia: " + profesional.aniosExperiencia + " año(s)"));
            if (profesional.descripcionExperiencia) {
                info.appendChild(crear("p", "", profesional.descripcionExperiencia));
            }
            // Cuando el empleador acepta, se habilita el contacto (y se mantiene al finalizar)
            const enTrabajo = postulacion.estado === "ACEPTADA" || postulacion.estado === "FINALIZADA";
            if (enTrabajo) {
                info.appendChild(crear("p", "detalle", "Contacto: " + persona.telefono + (persona.email ? " · " + persona.email : "")));
            }

            // Cuántos de los requisitos de la oferta cumple este profesional
            agregarCoincidencia(info, postulacion.ofertaLaboral.requisitosComunes, profesional.requisitosCumplidos, true);

            // Reputación del profesional (se completa cuando llega la respuesta del servidor)
            if (profesional.usuario) {
                const reputacion = crear("p", "detalle", "Reputación: ...");
                info.appendChild(reputacion);
                obtenerReputacion(profesional.usuario.id).then(function (r) {
                    reputacion.textContent = "Reputación: " + textoReputacion(r);
                });
                agregarOpiniones(info, profesional.usuario.id);
            }

            // Trabajo aceptado o terminado: se muestra el avance semana por semana
            if (enTrabajo) {
                const progreso = crear("div");
                info.appendChild(progreso);
                mostrarProgreso(progreso, postulacion.id);
            }

            const acciones = crear("div", "acciones");
            acciones.appendChild(crearEtiquetaEstado(postulacion.estado));

            // Solo se puede responder una postulación pendiente
            if (postulacion.estado === "PENDIENTE") {
                // Antes de responder se pide confirmación, así no se acepta ni se rechaza por un clic equivocado
                const aceptar = crear("button", "boton boton-chico", "Aceptar");
                aceptar.addEventListener("click", async function () {
                    const confirmado = await confirmarAccion(
                        "Vas a aceptar a " + persona.nombre + " " + persona.apellido + " para esta oferta. " +
                        "Se le va a mostrar tu contacto y la decisión no se puede deshacer.",
                        { titulo: "¿Aceptar a este profesional?", textoBoton: "Sí, aceptar", peligro: false });
                    if (confirmado) responder(postulacion.id, "aceptar");
                });
                const rechazar = crear("button", "boton boton-chico boton-peligro", "Rechazar");
                rechazar.addEventListener("click", async function () {
                    const confirmado = await confirmarAccion(
                        "Vas a rechazar a " + persona.nombre + " " + persona.apellido + ". La decisión no se puede deshacer.",
                        { titulo: "¿Rechazar a este profesional?", textoBoton: "Sí, rechazar" });
                    if (confirmado) responder(postulacion.id, "rechazar");
                });
                acciones.appendChild(aceptar);
                acciones.appendChild(rechazar);
            }

            // Trabajo en curso: se conversa y se puede dar por terminado
            if (postulacion.estado === "ACEPTADA") {
                agregarBotonFinalizar(acciones, postulacion.id, postulacion.ofertaLaboral.titulo, cargar, mensaje);
            }
            if (enTrabajo) {
                agregarChat(acciones, info, postulacion.id, postulacion.estado, sinLeer.get(postulacion.id) || 0);
            }

            // Recién con el trabajo finalizado se puede calificar al profesional (una sola vez)
            if (postulacion.estado === "ACEPTADA") {
                info.appendChild(crear("p", "detalle", "Vas a poder calificar al profesional cuando finalice el trabajo."));
            }
            if (postulacion.estado === "FINALIZADA") {
                if (calificadas.has(postulacion.id)) {
                    acciones.appendChild(crear("span", "ya-calificado", "Ya calificaste ✓"));
                } else {
                    const calificar = crear("button", "boton boton-chico", "Calificar al profesional");
                    calificar.addEventListener("click", function () {
                        calificar.remove();
                        info.appendChild(armarFormularioCalificacion(postulacion.id, cargar));
                    });
                    acciones.appendChild(calificar);
                }
            }

            acciones.appendChild(crear("a", "boton-enlace", "Ver perfil completo",
                { href: "perfil-publico.html?tipo=profesional&id=" + profesional.id }));
            agregarBotonDenuncia(acciones, info, "PROFESIONAL", profesional.id);

            tarjeta.appendChild(conAvatar(crearAvatar(persona.nombre, persona.apellido), info));
            tarjeta.appendChild(acciones);
            return tarjeta;
        }

        // accion es "aceptar" o "rechazar" y coincide con el final de la URL del backend
        async function responder(idPostulacion, accion) {
            const resultado = await pedir("/api/postulaciones/" + accion + "/" + idPostulacion, "PUT");
            if (resultado.ok) {
                cargar();
            } else if (resultado.status === 409) {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "Esta postulación ya fue respondida o cancelada."), "error");
                cargar();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo registrar la respuesta."), "error");
            }
        }

        cargar();
    </script>
</body>
</html>
