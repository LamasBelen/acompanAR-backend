<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis ofertas - acompanAR</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra-contenido">
            <a class="logo" href="index.html">acompan<span>AR</span></a>
            <nav class="menu" id="menu"></nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="cabecera-pagina item">
            <div>
                <h1>Mis ofertas</h1>
                <p class="subtitulo">Las ofertas que publicaste y siguen activas.</p>
            </div>
            <a class="boton" href="oferta-form.html">Publicar oferta</a>
        </div>

        <div id="mensaje" class="mensaje"></div>
        <div id="lista" class="lista"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        armarMenu();

        const lista = document.getElementById("lista");
        const mensaje = document.getElementById("mensaje");
        let usuario = null;

        async function cargar() {
            usuario = await requerirSesion();
            if (usuario === null) return;

            if (usuario.rol !== "EMPLEADOR") {
                mostrarMensaje(mensaje, "Esta pantalla es para empleadores.", "error");
                return;
            }

            const resultado = await pedir("/api/ofertas/empleador/" + usuario.idEmpleador);
            if (!resultado.ok) {
                mostrarMensaje(mensaje, "No se pudieron cargar tus ofertas.", "error");
                return;
            }

            lista.innerHTML = "";
            if (resultado.datos.length === 0) {
                lista.appendChild(crear("p", "vacio", "Todavía no publicaste ninguna oferta."));
                return;
            }
            resultado.datos.forEach(function (oferta) {
                lista.appendChild(armarTarjeta(oferta));
            });
        }

        function armarTarjeta(oferta) {
            const tarjeta = crear("div", "tarjeta item");

            const info = crear("div");
            info.appendChild(crear("h2", "", oferta.titulo));
            info.appendChild(crear("p", "detalle", "Publicada el " + formatearFecha(oferta.fechaPublicacion)));
            info.appendChild(crear("p", "", oferta.descripcion));
            if (oferta.requisitos) {
                info.appendChild(crear("p", "detalle", "Requisitos: " + oferta.requisitos));
            }

            const acciones = crear("div", "acciones");
            acciones.appendChild(crear("a", "boton boton-chico", "Ver postulantes", { href: "postulantes.html?oferta=" + oferta.id }));
            acciones.appendChild(crear("a", "boton boton-chico boton-secundario", "Editar", { href: "oferta-form.html?id=" + oferta.id }));

            const baja = crear("button", "boton boton-chico boton-peligro", "Dar de baja");
            baja.addEventListener("click", function () { darDeBaja(oferta.id); });
            acciones.appendChild(baja);

            tarjeta.appendChild(info);
            tarjeta.appendChild(acciones);
            return tarjeta;
        }

        async function darDeBaja(idOferta) {
            if (!confirm("¿Querés dar de baja esta oferta? Ya no la van a ver los profesionales.")) return;

            const resultado = await pedir("/api/ofertas/baja/" + idOferta, "PUT");
            if (resultado.ok) {
                cargar();
            } else {
                mostrarMensaje(mensaje, mensajeDeError(resultado, "No se pudo dar de baja la oferta."), "error");
            }
        }

        cargar();
    </script>
</body>
</html>
