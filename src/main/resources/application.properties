# ==========================================
# CONFIGURACIÓN GENERAL
# ==========================================
spring.application.name=backend

# Perfil activo: "local" (tu base en tu compu) o "remoto" (base en la nube).
# Se elige con la variable de entorno SPRING_PROFILES_ACTIVE (si no existe, usa "local").
# Los datos de conexión de cada perfil están en application-local.properties
# y application-remoto.properties. AQUÍ NO HAY NINGUNA CREDENCIAL ESCRITA.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==========================================
# SPRING DATA JPA (HIBERNATE)
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# USUARIO ADMINISTRADOR INICIAL
# Se crea al arrancar si no existe. Sus datos vienen de variables de entorno.
# ==========================================
app.admin.usuario=${ADMIN_USUARIO}
app.admin.contrasena=${ADMIN_CONTRASENA}
